name: Сборка APK

on:
  push:
    branches: [main]
    paths-ignore: ['maps/**', '.github/workflows/maps.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Ключ подписи
        id: key
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Сборка
        env:
          SIGNING_KEYSTORE: ${{ steps.key.outputs.path }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: |
          if [ -z "$SIGNING_KEYSTORE" ]; then unset SIGNING_KEYSTORE; fi
          ./gradlew --no-daemon assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/vse-v-odnom-0.1.${{ github.run_number }}.apk"

      - name: Публикация релиза
        if: steps.key.outputs.path != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Всё в одном 0.1.${{ github.run_number }}
          files: out/*.apk
          make_latest: true

      - name: APK как артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
